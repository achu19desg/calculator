<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Calculator</title>
</head>

<body class="bg-purple-900 min-h-screen flex justify-center items-center p-4">

    <div class="bg-stone-900 p-6 rounded-2xl shadow-2xl w-full max-w-sm">

            <input id="display"
                type="text"
                name="display"
                class="w-full h-20 bg-stone-700 text-white text-right text-4xl px-4 rounded-xl outline-none mb-6"
                placeholder="0"
                readonly
            >

    

        <!-- Buttons -->
        <div class="grid grid-cols-4 gap-4">

            <button type="button" class="bg-stone-700 text-white p-4 rounded-xl text-xl hover:bg-stone-600">AC</button>

            <button type="button" class="bg-stone-700 text-white p-4 rounded-xl text-xl hover:bg-stone-600">DE</button>

            <button type="button" class="bg-orange-500 text-white p-4 rounded-xl text-xl hover:bg-orange-400">%</button>

            <button type="button" class="bg-orange-500 text-white p-4 rounded-xl text-xl hover:bg-orange-400">/</button>

            <button type="button" class="bg-stone-700 text-white p-4 rounded-xl text-xl hover:bg-stone-600">7</button>

            <button type="button" class="bg-stone-700 text-white p-4 rounded-xl text-xl hover:bg-stone-600">8</button>

            <button type="button" class="bg-stone-700 text-white p-4 rounded-xl text-xl hover:bg-stone-600">9</button>

            <button type="button" class="bg-orange-500 text-white p-4 rounded-xl text-xl hover:bg-orange-400">*</button>

            <button type="button" class="bg-stone-700 text-white p-4 rounded-xl text-xl hover:bg-stone-600">4</button>

            <button type="button" class="bg-stone-700 text-white p-4 rounded-xl text-xl hover:bg-stone-600">5</button>

            <button type="button" class="bg-stone-700 text-white p-4 rounded-xl text-xl hover:bg-stone-600">6</button>

            <button type="button" class="bg-orange-500 text-white p-4 rounded-xl text-xl hover:bg-orange-400">-</button>

            <button type="button" class="bg-stone-700 text-white p-4 rounded-xl text-xl hover:bg-stone-600">1</button>

            <button type="button" class="bg-stone-700 text-white p-4 rounded-xl text-xl hover:bg-stone-600">2</button>

            <button type="button" class="bg-stone-700 text-white p-4 rounded-xl text-xl hover:bg-stone-600">3</button>

            <button type="button" class="bg-orange-500 text-white p-4 rounded-xl text-xl hover:bg-orange-400">+</button>

            <button type="button" class="bg-stone-700 text-white p-4 rounded-xl text-xl hover:bg-stone-600 col-span-2">0</button>

            <button type="button" class="bg-stone-700 text-white p-4 rounded-xl text-xl hover:bg-stone-600">.</button>

            <button type="button" class="bg-green-500 text-white p-4 rounded-xl text-xl hover:bg-green-400">=</button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
